[FCMChat]
; Position in 1920x1080 HUD coordinate space
x=10
y=10
; Panel dimensions
width=480
height=330
; Font size for messages (keep < 48 to stay within GFx glyph cache)
fontSize=14
; KEYBIND NOTE — two independent bindings control chat input:
;
;   1. ZFE native hotkey (FCMChatWidget.ini → OpenChatKey=PAGE_DOWN):
;      ZFE polls this via isChatKeyPressed. It is the AUTHORITATIVE ZFE-layer
;      binding. Change in Data/ZFE/TextChat/fragments/FCMChatWidget.ini, or
;      override in Data/configuration/zfe.ini [TextChat] OpenChatKey=...
;
;   2. HUDMod::UserEvent binding (this key, openKey=):
;      The widget listens for HUDMod::UserEvent from FO76's control-map.
;      This fires SharedHUDTools.TextEdit (the HUDModLoader text-entry box).
;
; VALID openKey values (FO76 control-map action names):
;   Console, TeamChat, PAGE_DOWN, NextPage, DiagnosticSnapshot
;
; DEFAULT: PAGE_DOWN — matches ZFE OpenChatKey so one key opens both.
openKey=PAGE_DOWN
