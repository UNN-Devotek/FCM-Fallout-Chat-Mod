[FCMChat]
; Position in 1920x1080 HUD coordinate space
x=10
y=10
; Panel dimensions
width=480
height=300
; Font size for messages (keep < 48 to stay within GFx glyph cache)
fontSize=14
; Control-map action name that opens chat (Console = tilde/backtick key)
; Other options: TeamChat, DiagnosticSnapshot
openKey=Console
; FCM channel UUID to send messages to (General root by default)
channel=00000000-0000-0000-0000-000000000001
