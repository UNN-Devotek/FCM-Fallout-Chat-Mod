[FCMChat]
; ── FCMChatWidget user config ──────────────────────────────────────────────────
; Parsed by FcmConfig.parse() (see FcmConfig.hx). Every value is validated + clamped;
; an invalid/missing value falls back to the default shown, so a bad edit cannot crash
; the widget or push it off-screen. Colors accept #RRGGBB, RRGGBB, or 0xRRGGBB.
; Edit, then reload the widget (HUDModLoader F11 menu) to apply.

; ── Geometry (1920x1080 HUD coordinate space) ──
x=10                 ; clamp 0..(1920-width)
y=10                 ; clamp 0..(1080-height)
width=400            ; clamp 200..1920
height=260           ; clamp 120..1080
fontSize=14          ; clamp 8..47 (GFx glyph cache < 48)
inputHeight=28       ; requested input row height, clamp 28..120
inputFontSize=0      ; 0 preserves existing size; otherwise 8..47, independent of feed
; Example for larger typing text: inputHeight=48 and inputFontSize=24.
; The row grows to fit the font and shrinks to preserve feed space in small panels.
; Font size is reduced if necessary to fit a small panel. Values survive F11 saves.
; ── Identity fallback (only if boot stalls at "retrying..." forever) ──
; The widget waits for the game's AccountInfoData handle before connecting. If xScal
; serves it blank all session (empty name, isLoggedIn=false — see xscal.log), boot
; never reaches chat. Setting displayName supplies the handshake label so it can
; proceed. The value is a client-side bootstrap label only. For a linked token the relay
; keeps the server-held identity and ignores this value for durable account/message identity.
; Your real game handle wins in the HUD when it becomes available. Default off (blank = disabled).
;displayName=YourCharacterName

; ── Colors (solid only; no glow/gradient — Scaleform crash rule) ──
; Defaults reproduce the amber Pip-Boy theme. Uncomment to override.
;bgColor=#0A0907          ; panel fill
;bgAlpha=0.94             ; panel opacity 0.0..1.0
;borderColor=#F5CB5B      ; panel border + separators
;textColor=#FAF4DA        ; message body
;senderColor=#F5CB5B      ; sender name
;tabActiveColor=#F5CB5B   ; active tab / accents
;tabInactiveColor=#B49544 ; inactive tab text
;promptColor=#AC9043      ; idle prompt hint (only shown when showHints=true)
;tabRowColor=#080705      ; tab-box background
;inputBgColor=#080705     ; input-box background (also the overlaid ZFE editor)
;inputTextColor=#F5CB5B   ; typed text color (both input paths)
;
; Channel tags and their colors/visibility, badges, emojis and channel defaults
; are fixed by the HUD and are not appearance settings.
; Input width/alignment follow the widget input area; only height/font size vary.

; ── Limits ──
;maxMessages=200      ; feed ring-buffer cap (clamp 10..500; retains initial all-channel history)
;maxSendLen=225       ; truncate before send (clamp 1..500, server hard cap 500)
;pollMs=5000          ; event-poll interval ms (clamp 1000..60000). Each poll is a fresh wss
                      ;   TLS handshake under Wine (~120ms) — LOWER = snappier messages but
                      ;   more game lag; HIGHER = smoother game but slower message refresh.
                      ;   A successful send triggers one additional next-tick poll for its
                      ;   authoritative echo; this setting still controls background polling.

; Auto-hide is independent of the remembered delay. F11 exposes both controls.
autoHideEnabled=true
; Delay in seconds (1..600). Legacy 0 also disables auto-hide.
autoHideSec=60

; ── Feed toggles ──
;showHints=false      ; idle prompt help text (default OFF = blank input row)

; ── Link flow ──
; URL shown in the widget's "Link your account at ..." prompt. The package helper stamps the
; target-specific link host; URL-safe characters only.
linkUrl=falloutchatmod.com/link

; ── Keybinds ───────────────────────────────────────────────────────────────────
; Open-chat configuration is provider-specific:
;   1. ZFE native hotkey — Data/ZFE/TextChat/fragments/FCMChatWidget.ini OpenChatKey
;      (or override in Data/configuration/zfe.ini [TextChat] OpenChatKey). This is the
;      AUTHORITATIVE open key (ZFE reads it natively via isChatKeyPressed), and openKey
;      below should match it.
;   2. xScal physical hotkey — openKey below is mapped to the documented numeric
;      Input.RegisterKey/Input.IsKeyPressed surface; the named HUDMod::UserEvent path
;      remains a compatibility fallback. xScal has no OpenChatKey setting.
;      Reference: https://www.nexusmods.com/fallout76/articles/268
;
; Page actions switch channels and the three scroll actions below navigate the feed. The
; loader forwards named control-map actions; xScal and the ZFE compatibility path also poll
; physical tokens when they map to a Windows virtual key. Up/Down preserve the packaged arrow
; behavior. Set a different action (for example Console or F12) to rebind it; set an empty value
; to disable that scroll direction. Scroll-to-bottom is intentionally UNSET by default, so Home
; and End remain ordinary game controls until you opt in.
;
; NOTE: default open key is INSERT (matches the Text Chat mod default and FcmConfig code default).
; ZFE example: to use Delete, set openKey=DELETE here AND OpenChatKey=DELETE in the
; active ZFE [TextChat] configuration. See KEYBINDS.txt in the packaged archive.
; ZFE hotkey reference: https://www.nexusmods.com/fallout76/articles/255
; xScal has no OpenChatKey INI setting. The widget maps openKey to xScal's Input.* physical
; polling API, then keeps the named HUDMod::UserEvent path as a compatibility fallback.
; xScal registration is polling rather than keyboard suppression; see KEYBINDS.txt.
openKey=INSERT
;channelNextKey=NextPage   ; next channel
;channelPrevKey=PrevPage   ; previous channel
; Default Up also accepts ArrowUp/CursorUp/DpadUp aliases.
scrollUpKey=Up
; Default Down also accepts ArrowDown/CursorDown/DpadDown aliases.
scrollDownKey=Down
; Optional jump to newest; e.g. Home, End, F12, or ScrollBottom. Blank = unbound.
scrollBottomKey=
;hideKey=                  ; optional hide key (a forwarded action); blank = use /hide or the F11 menu

; ── HUDMode gating ───────────────────────────────────────────────────────────
; Blacklist of HUDMode strings where the widget must stay hidden. Single key
; hideInHUDModes (comma-separated, case-insensitive). Opinionated default hides
; MainMenu, Pipboy, CAMP build modes, vendor/crafting/repair (ContainerMode) and
; the map (MapMenu) so the chat does not cover those UIs.
; Clear the value to never hide on HUDMode. Example:
;hideInHUDModes=MainMenu,Pipboy,WorkshopMode,WorkshopNoCrosshairMode,CampPlacement,ContainerMode,MapMenu
; Supported values come from HUDModeData.data.hudMode plus synthetic "MainMenu"
; (MenuStackData). See Shared/HUDModes.as for full list (WorkshopMode, Pipboy, ContainerMode, MapMenu, etc.).
hideInHUDModes=MainMenu,Pipboy,WorkshopMode,WorkshopNoCrosshairMode,CampPlacement,ContainerMode,MapMenu

; ── World-event auto-broadcast (global events leaf) ──────────────────────────
; When true, reads RecentActivitiesData (same source HUDChallenges uses) for
; publicEvent (type 1) and broadcasts each new event exactly once to the global
; events channel (000...003, not server FCMROOM), including mutation and
; participants, for players on other Fallout servers to hop.
; Requires events in AllowedChannels/Data/ZFE/TextChat/fragments/FCMChatWidget.ini.
;autoBroadcastWorldEvents=false  ; default OFF — global broadcast is opt-in
; Which events may be announced (comma-separated, case-insensitive EXACT names —
; never substrings, so "Hunt" can never match "Head Hunt"). The game serves
; names with an "Event: " prefix ("Event: Scorched Earth"); the widget strips
; one leading prefix before matching AND before display, so list entries work
; with or without it. Spellings per
; fallout.fandom.com/wiki/Fallout_76_public_events (the zfe.log auto-broadcast
; line prints live names to verify).
;broadcastEventsMode=allow  ; allow = ONLY listed names are announced (default);
;                           ; deny = every valid name EXCEPT the listed ones.
; An allow-list left blank reads as broadcast OFF (quietly, like the toggle).
;broadcastEvents=Scorched Earth,Neurological Warfare,A Colossal Problem,Seismic Activity,Encryptid,Eviction Notice,Moonshine Jamboree
