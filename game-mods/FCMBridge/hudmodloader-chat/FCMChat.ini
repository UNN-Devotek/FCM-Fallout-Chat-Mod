[FCMChat]
; ── FCMChatWidget user config ──────────────────────────────────────────────────
; Parsed by FcmConfig.parse() (see FcmConfig.hx). Every value is validated + clamped;
; an invalid/missing value falls back to the default shown, so a bad edit cannot crash
; the widget or push it off-screen. Colors accept #RRGGBB, RRGGBB, or 0xRRGGBB.
; Edit, then reload the widget (HUDModLoader F11 menu) to apply.

; ── Geometry (1920x1080 HUD coordinate space) ──
x=10                 ; clamp 0..(1920-width)
y=10                 ; clamp 0..(1080-height)
width=400            ; clamp 200..1920
height=260           ; clamp 120..1080
fontSize=14          ; clamp 8..47 (GFx glyph cache < 48)
;inputHeight=28       ; input strip height (clamp 28..120, effective = max(inputHeight, inputFontSize+10))
;inputFontSize=0      ; input text size 8..47, 0=auto (=fontSize) — fixes clipped entry when fontSize is large
; ── Identity fallback (only if boot stalls at "retrying..." forever) ──
; The widget waits for the game's AccountInfoData handle before connecting. If xScal
; serves it blank all session (empty name, isLoggedIn=false — see xscal.log), boot
; never reaches chat. Setting displayName supplies the handshake label so it can
; proceed. SAFE: relay auth/link state comes from your token's linked account, never
; the name — a wrong value only mislabels your own messages. Your real game handle
; ALWAYS wins once the game provides it. Default off (blank = disabled).
;displayName=Kate6H

; ── Colors (solid only; no glow/gradient — Scaleform crash rule) ──
; Defaults reproduce the amber Pip-Boy theme. Uncomment to override.
;bgColor=#0A0907          ; panel fill
;bgAlpha=0.94             ; panel opacity 0.0..1.0
;borderColor=#F5CB5B      ; panel border + separators
;textColor=#FAF4DA        ; message body
;senderColor=#F5CB5B      ; sender name
;channelTagColor=#8FBC8F  ; [Channel] tag
;tabActiveColor=#F5CB5B   ; active tab / accents
;tabInactiveColor=#B49544 ; inactive tab text
;promptColor=#AC9043      ; idle prompt hint (only shown when showHints=true)
;tabRowColor=#080705      ; tab-row + input-box background
;
; Per-channel colors — each channel's [Channel] MESSAGE TAG renders in its own color,
; mirroring the website (chat_rooms.color, pulled from PROD 2026-06-28). NOTE: this colors the
; [Channel] tag on messages ONLY — the sub-tab row uses the header colors (tabActiveColor /
; tabInactiveColor), not these. Override any:
;colorGeneral=#1ABAFF     ; General  (slug: global)
;colorTrading=#008F37     ; Trading  (slug: trade)
;colorEvents=#C88A51      ; Events
;colorInfests=#5ABD0A     ; Infests
;colorRaids=#CE0909       ; Raids
;colorServer=#ECBB51      ; Server / world session

; ── Limits ──
;maxMessages=200      ; feed ring-buffer cap (clamp 10..500; retains initial all-channel history)
;maxSendLen=225       ; truncate before send (clamp 1..500, server hard cap 500)
;pollMs=5000          ; event-poll interval ms (clamp 1000..60000). Each poll is a fresh wss
                      ;   TLS handshake under Wine (~120ms) — LOWER = snappier messages but
                      ;   more game lag; HIGHER = smoother game but slower message refresh.
                      ;   A successful send triggers one additional next-tick poll for its
                      ;   authoritative echo; this setting still controls background polling.

; ── Feed toggles ──
;showChannelTag=true  ; show the [Channel] tag on each message
;showHints=false      ; idle prompt help text (default OFF = blank input row)

; ── Link flow ──
; URL shown in the widget's "Link your account at ..." prompt. The package helper stamps the
; target-specific link host; URL-safe characters only.
linkUrl=falloutchatmod.com/link

; ── Keybinds ───────────────────────────────────────────────────────────────────
; Two independent open-chat bindings (both should match):
;   1. ZFE native hotkey — Data/ZFE/TextChat/fragments/FCMChatWidget.ini OpenChatKey
;      (or override in Data/configuration/zfe.ini [TextChat] OpenChatKey). This is the
;      AUTHORITATIVE open key (ZFE reads it natively via isChatKeyPressed). It is the
;      ONLY freely-choosable physical key.
;   2. openKey below — the HUDMod::UserEvent path; should match OpenChatKey.
;
; Page actions switch channels and arrow actions scroll the feed. The loader forwards the
; named control-map actions; physical aliases (PageUp/PageDown, Up/Down, Home/End) are also
; accepted for older/custom loader builds. Arrow/Home/End are runtime actions, not config keys.
;
; NOTE: default open key is INSERT (matches the Text Chat mod default and FcmConfig code default).
openKey=INSERT
;channelNextKey=NextPage   ; next channel
;channelPrevKey=PrevPage   ; previous channel
;hideKey=                  ; optional hide key (a forwarded action); blank = use /hide or the F11 menu

; ── HUDMode gating ───────────────────────────────────────────────────────────
; Blacklist of HUDMode strings where the widget must stay hidden. Single key
; hideInHUDModes (comma-separated, case-insensitive). Opinionated default hides
; MainMenu, Pipboy, CAMP build modes, vendor/crafting/repair (ContainerMode) and
; the map (MapMenu) so the chat does not cover those UIs.
; Clear the value to never hide on HUDMode. Example:
;hideInHUDModes=MainMenu,Pipboy,WorkshopMode,WorkshopNoCrosshairMode,CampPlacement,ContainerMode,MapMenu
; Supported values come from HUDModeData.data.hudMode plus synthetic "MainMenu"
; (MenuStackData). See Shared/HUDModes.as for full list (WorkshopMode, Pipboy, ContainerMode, MapMenu, etc.).
hideInHUDModes=MainMenu,Pipboy,WorkshopMode,WorkshopNoCrosshairMode,CampPlacement,ContainerMode,MapMenu

; ── World-event auto-broadcast (global events leaf) ──────────────────────────
; When true, reads RecentActivitiesData (same source HUDChallenges uses) for
; publicEvent (type 1) and broadcasts each new event exactly once to the global
; events channel (000...003, not server FCMROOM), including mutation, participants
; and stable [EVT-XXXXXXXXXXXX] suffix, for players on other Fallout servers to hop.
; Requires events in AllowedChannels/Data/ZFE/TextChat/fragments/FCMChatWidget.ini.
;autoBroadcastWorldEvents=false  ; default OFF — global broadcast is opt-in
