[FCMChat]
; ── FCMChatWidget user config ──────────────────────────────────────────────────
; Parsed by FcmConfig.parse() (see FcmConfig.hx). Every value is validated + clamped;
; an invalid/missing value falls back to the default shown, so a bad edit cannot crash
; the widget or push it off-screen. Colors accept #RRGGBB, RRGGBB, or 0xRRGGBB.
; Edit, then reload the widget (HUDModLoader F12 menu) to apply.

; ── Geometry (1920x1080 HUD coordinate space) ──
x=10                 ; clamp 0..(1920-width)
y=10                 ; clamp 0..(1080-height)
width=480            ; clamp 200..1920
height=306           ; clamp 120..1080
fontSize=14          ; clamp 8..47 (GFx glyph cache < 48)

; ── Colors (solid only; no glow/gradient — Scaleform crash rule) ──
; Defaults reproduce the amber Pip-Boy theme. Uncomment to override.
;bgColor=#0A0907          ; panel fill
;bgAlpha=0.94             ; panel opacity 0.0..1.0
;borderColor=#F5CB5B      ; panel border + separators
;textColor=#FAF4DA        ; message body
;senderColor=#F5CB5B      ; sender name
;channelTagColor=#8FBC8F  ; [Channel] tag
;tabActiveColor=#F5CB5B   ; active tab / accents
;tabInactiveColor=#B49544 ; inactive tab text
;promptColor=#AC9043      ; idle prompt hint (only shown when showHints=true)
;tabRowColor=#080705      ; tab-row + input-box background
;timestampColor=#AC9043   ; per-message time (when showTimestamps=true)

; ── Limits ──
;maxMessages=100      ; feed ring-buffer cap (clamp 10..500)
;maxSendLen=225       ; truncate before send (clamp 1..500, server hard cap 500)

; ── Feed toggles ──
;showChannelTag=true  ; show the [Channel] tag on each message
;showTimestamps=true  ; show a HH:MM time on each message
;showHints=false      ; idle prompt help text (default OFF = blank input row)

; ── Keybinds ───────────────────────────────────────────────────────────────────
; Two independent open-chat bindings (both should match):
;   1. ZFE native hotkey — Data/ZFE/TextChat/fragments/FCMChatWidget.ini OpenChatKey
;      (or override in Data/configuration/zfe.ini [TextChat] OpenChatKey). This is the
;      AUTHORITATIVE open key (ZFE reads it natively via isChatKeyPressed). It is the
;      ONLY freely-choosable physical key.
;   2. openKey below — the HUDMod::UserEvent path; should match OpenChatKey.
;
; Channel/scroll keys can ONLY be FO76 control-map actions the loader forwards:
;   NextPage (Page Down), PrevPage (Page Up), Console (~), TeamChat (T), DiagnosticSnapshot (F12).
; Any other physical key must be mapped to one of those actions in FO76's control settings.
;
; NOTE: default open key is INSERT (matches the Text Chat mod default and FcmConfig
; code default). ZFE acceptance of INSERT is pending in-game verification (VER-1); if it
; does not fire, fall back to openKey=PAGE_DOWN (the known-good value).
openKey=INSERT
;channelNextKey=NextPage   ; next channel
;channelPrevKey=PrevPage   ; previous channel
;hideKey=                  ; optional hide key (a forwarded action); blank = use /hide + F12
