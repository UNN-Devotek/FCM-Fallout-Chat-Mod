; Add this entry to the game's Data/hudmodloader.ini
; (append it below any existing widget entries)
;
; "reloadable" enables hot-reload via the F12 HUDTools menu during development.
; List FCMChatWidget AFTER FCMBridge so it renders on top (HUDModLoader stacks
; widgets in INI order — later entries get higher z-order).

[FCMChatWidget]
file=Data/MCM/Config/FCMBridge/hudmodloader-chat/FCMChatWidget.swf
reloadable=true
