; Append this line to the game's Data/hudmodloader.ini
; (HUDModLoader format: bare widget name per line, no [section]/file= key-value syntax)
;
; HUDModLoader loads the SWF from URLRequest("FCMChatWidget.swf"), which resolves
; relative to its own SWF at interface/FCMChatWidget.swf — the file must be packed
; into the FCMChatWidget.ba2 at that path.
;
; For development, a loose file at Data/interface/FCMChatWidget.swf also works.
;
; Place FCMChatWidget AFTER any other widgets that should render below it.
FCMChatWidget
