; Data/ZFE/TextChat/fragments/FCMChatWidget.ini
;
; ZFE TextChat fragment for FCMChatWidget.
; Filename MUST match the hudmodloader.ini entry (FCMChatWidget) exactly.
; ZFE reads Data/hudmodloader.ini and applies the first matching fragment found.
; Place this file at: Data/ZFE/TextChat/fragments/FCMChatWidget.ini
;
; USER OVERRIDE: any key here can be overridden per-key in:
;   Data/configuration/zfe.ini   [TextChat] section
; Values in zfe.ini win over fragment values.
;
; Valid OpenChatKey values (FO76 control-map action names):
;   INSERT                — Insert (default; matches the Text Chat mod default)
;   Console               — tilde / backtick (default in-game console key)
;   TeamChat              — default team chat key (T)
;   PAGE_DOWN             — Page Down (known-good fallback for HUDModLoader widgets)
;   DiagnosticSnapshot    — rarely used, safe fallback
; Note: this key is handled by ZFE natively (isChatKeyPressed). The widget's
; FCMChat.ini openKey is a SEPARATE binding handled by HUDMod::UserEvent — see below.

[TextChat]
; Key ZFE uses for native hotkey detection (isChatKeyPressed).
; This is the AUTHORITATIVE open-chat binding. Default INSERT matches the Text Chat
; mod default. If another mod owns that action, PAGE_DOWN remains a safe fallback
; that also avoids the tilde/Console game binding.
OpenChatKey=INSERT

; Default channel shown on connect (must be in AllowedChannels).
DefaultChannel=global

; Channels the widget may send/receive on (comma-separated, no spaces).
; "server" is reserved for world-session control messages — keep it here.
AllowedChannels=global,trade,events,raids,infests,server

; Whether ZFE auto-connects when the SWF loads. The widget handles connect
; itself after BSUIDataManager is ready; set false to avoid a race.
AutoConnect=false

; The package helper stamps the target-specific relay endpoint. Users may override this key in
; Data/configuration/zfe.ini [TextChat].
; The endpoint path is /relay (not /zfe-relay).
Endpoint=wss://falloutchatmod.com/relay
