; Data/ZFE/TextChat/fragments/FCM.ini
; TextChat fragment for Fallout Chat Mod (FCM-standalone.ba2).
;
; ZFE reads Data/hudmodloader.ini and applies the first active matching fragment.
; The fragment filename must match the active SWF entry in hudmodloader.ini.
; Values in Data/configuration/zfe.ini override these per-key (user overrides).
;
; Endpoint policy: production must be wss:// with a path (e.g. /relay).
; For dev/loopback testing override in zfe.ini: Endpoint=ws://127.0.0.1:8788/
;
; AllowedChannels: comma-separated slug list. Must match CHANNEL_SLUGS in FCMBridge.hx
; and the relay's slug-to-UUID map. "system" is reserved and cannot be sent.
;
; DO NOT include whisper, party, or clan here — they are not yet implemented
; in the FCM relay (deferred per fcm-integration.md).

[TextChat]
; UPDATE THIS per environment before packaging. Replace with the actual relay URL.
; Dev:  Endpoint=ws://127.0.0.1:8788/
; Prod: Endpoint=wss://falloutchatmod.com/relay
Endpoint=wss://dev.falloutchatmod.com/relay

; Channel vocabulary for FCM. These slugs map server-side to FCM channel UUIDs:
;   global  -> General   (00000000-0000-0000-0000-000000000005)
;   trade   -> Trading   (00000000-0000-0000-0000-000000000002)
;   events  -> Events    (00000000-0000-0000-0000-000000000003)
;   infests -> Infests   (983995c1-f9ab-44c0-9b78-8b4cbf497273)
;   raids   -> Raids     (00000000-0000-0000-0000-000000000004)
;   server  -> current world-session room (dynamic; worldId-bound by relay)
AllowedChannels=global,trade,server,events,raids,infests

; Default channel shown on connect.
DefaultChannel=global

; Hotkey to open the in-game chat input (must match fcmIniOpenKey in fcm-inject.as).
; PAGE_DOWN is dead in the FO76 HUD so it does not conflict with vanilla bindings.
OpenChatKey=INSERT

; Include timestamps in the chat feed (ZFE renders them natively alongside messages).
EnableTimestamps=true
