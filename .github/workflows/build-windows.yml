name: Build Windows (NSIS)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g. 1.3.84)'
        required: true
        type: string
      publish:
        description: 'Upload artifact to backend release registry'
        required: false
        type: boolean
        default: false

# Least privilege: the build reads the repo and publishes via SSH/HTTP to the
# backend registry (not via GITHUB_TOKEN), so read is sufficient.
permissions:
  contents: read

jobs:
  # Owner-only gate: workflow_dispatch is runnable by anyone with write access,
  # so restrict release builds to the repo owner. Every build job needs this.
  authorize:
    name: Authorize (owner-only)
    runs-on: ubuntu-latest
    steps:
      - name: Verify actor is the owner
        env:
          ACTOR: ${{ github.actor }}
        run: |
          if [ "$ACTOR" != "UNN-Devotek" ]; then
            echo "::error::$ACTOR is not authorized to trigger release builds (owner-only)."
            exit 1
          fi
          echo "Authorized: $ACTOR"

  build-windows:
    name: Build Windows NSIS installer
    needs: authorize
    runs-on: [self-hosted, windows, unn]
    defaults:
      run:
        shell: powershell

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'

      # Azure Trusted Signing prerequisite: electron-builder's TrustedSigning PowerShell
      # module fetches the Azure CodeSigning dlib via `dotnet tool install`. The self-hosted
      # runner ships no .NET SDK, so provide one here (adds `dotnet` to the job PATH). Without
      # this, signing dies in NugetInstall.psm1 with "Start-Process: cannot find the file
      # specified" (dotnet missing). signtool itself comes bundled via the module's SDK BuildTools.
      - uses: actions/setup-dotnet@9a946fdbd5fb07b82b2f5a4466058b876ab72bb2 # v5.3.0
        with:
          dotnet-version: '8.0.x'

      - name: Bump version in package.json
        env:
          VERSION: ${{ inputs.version }}
        run: |
          $pkg = Get-Content cross-platform-overlay\package.json -Raw | ConvertFrom-Json
          $pkg.version = $env:VERSION
          $utf8NoBOM = [System.Text.UTF8Encoding]::new($false)
          $path = (Resolve-Path cross-platform-overlay\package.json).Path
          [System.IO.File]::WriteAllText($path, ($pkg | ConvertTo-Json -Depth 100), $utf8NoBOM)

      - name: Install admin-dashboard dependencies
        run: |
          cd admin-dashboard
          npm ci

      - name: Install overlay dependencies
        run: |
          cd cross-platform-overlay
          npm ci

      - name: Build renderer
        run: |
          cd cross-platform-overlay
          npm run build:renderer

      - name: Build Windows NSIS + portable packages (Azure Trusted Signing)
        env:
          # Azure Trusted Signing auth via EnvironmentCredential. The service principal
          # `fcm-signing-ci` holds ONLY the "Artifact Signing Certificate Profile Signer"
          # role, scoped to the `fcm-trusted-signing` account. electron-builder installs
          # the TrustedSigning PowerShell module itself and calls Invoke-TrustedSigning.
          # See docs/deployment/releasing-the-overlay.md → "Windows code signing".
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: |
          cd cross-platform-overlay
          # `azureSignOptions` is injected HERE (not in package.json) on purpose: the
          # unsigned CI gate build (ci.yml → overlay-build-windows-nsis, which has no
          # Azure creds) must stay green. Putting it in package.json would make every
          # PR build attempt to sign and fail. publisherName comes from a repo variable
          # so the signer's legal name stays out of git history (it is still public on
          # every signed binary's cert subject).
          .\node_modules\.bin\electron-builder --win nsis portable --publish never `
            "-c.win.azureSignOptions.publisherName=${{ vars.AZURE_PUBLISHER_NAME }}" `
            "-c.win.azureSignOptions.endpoint=https://eus.codesigning.azure.net" `
            "-c.win.azureSignOptions.certificateProfileName=fcm-public-trust" `
            "-c.win.azureSignOptions.codeSigningAccountName=fcm-trusted-signing"

      - name: Compute SHA-512 (base64) of NSIS installer
        id: sha512
        run: |
          $exe = Get-ChildItem cross-platform-overlay\dist-electron\*.exe |
            Where-Object { $_.Name -notlike '*blockmap*' -and $_.Name -like '*Setup*' } |
            Select-Object -First 1
          if (-not $exe) {
            $exe = Get-ChildItem cross-platform-overlay\dist-electron\*.exe |
              Where-Object { $_.Name -notlike '*blockmap*' } |
              Select-Object -First 1
          }
          Write-Host "Installer: $($exe.FullName)"
          $hash = Get-FileHash $exe.FullName -Algorithm SHA512
          $hex = $hash.Hash
          $hashBytes = New-Object byte[] ($hex.Length / 2)
          for ($i = 0; $i -lt $hex.Length; $i += 2) { $hashBytes[$i/2] = [Convert]::ToByte($hex.Substring($i, 2), 16) }
          $b64 = [System.Convert]::ToBase64String($hashBytes)
          Write-Host "SHA-512 (base64): $b64"
          "sha512=$b64" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "exe=$($exe.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Upload installer artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fallout-chat-mod-${{ inputs.version }}-win-x64
          # Only the installer .exe — the overlay no longer auto-updates, so no
          # latest.yml feed manifest or .blockmap differential is produced.
          path: |
            cross-platform-overlay/dist-electron/*.exe
          retention-days: 90
