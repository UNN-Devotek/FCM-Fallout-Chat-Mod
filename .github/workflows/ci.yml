name: CI

# ── Runner model: GitHub-hosted (default) with self-hosted fallback ──────────────
# CI now defaults to GitHub-hosted runners (`ubuntu-latest` / `windows-latest`).
# Self-hosted runners remain available as a fallback via repo variables:
#   CI_RUNNER         — JSON runner label for Linux jobs, e.g. '["self-hosted","linux","unn"]'
#   CI_RUNNER_WINDOWS — JSON runner label for Windows jobs, e.g. '["self-hosted","windows","unn"]'
# Toggle to self-hosted: gh variable set CI_RUNNER '["self-hosted","linux","unn"]'
# Toggle back to hosted: gh variable delete CI_RUNNER
# (Same pattern for CI_RUNNER_WINDOWS.)
#
# The security boundary is the `ci-approved` label gate (see `authorize` job), NOT the runner.
# Untrusted fork code is blocked regardless of which runner is in use.
#
# The single required branch-protection check is the `CI Summary` job below.
# It gates: unit-vitest (overlay + dashboard matrix), overlay-launch-smoke-linux
# (packaged-launch smoke), overlay-build-windows-nsis (NSIS build verification),
# lint-typecheck, backend-jest, and gamemod-anchors (in-game .ba2 SWF anchors) —
# all blocking for PRs.
#
# The `overlay-build-windows-nsis` job builds the NSIS installer NATIVELY on
# `windows-latest` (no Wine, no Docker, no GHCR image — the self-hosted Wine/DinD
# strategy was superseded by the runner migration). It statically verifies the
# artifacts (installer + exe present) and that NO auto-update feed files
# (app-update.yml / latest*.yml) are emitted — the overlay no longer auto-updates.
#
# ── OVERLAY RELEASE GATES (MANDATORY, fail-closed) — see docs/deployment/releasing-the-overlay.md ──
# A shipped overlay build MUST be tested before it goes ANYWHERE. v1.3.82 shipped a
# build whose main process crashed on launch (`Cannot find module './overlay-core'`,
# missing from electron-builder build.files) — every user who installed it was bricked.
# With auto-update now removed, a bad build means a manual re-download for everyone, so
# the launch gate matters as much as ever. To prevent recurrence:
#   - CI guard (runs here, in the Overlay Vitest job): __tests__/build-files.test.js
#     asserts every main-process require('./x') is included in package.json build.files.
#   - Release-time gates (run on the build machine BEFORE any publish — POST /admin/releases,
#     Nexus): Packaging/smoke-test.ps1 (clean launch, no crash) and Packaging/vt-gate.ps1
#     (VirusTotal scan must complete and PASS). If either fails, the build is published NOWHERE.
# ──────────────────────────────────────────────────────────────────────────────

on:
  # PRs are LABEL-TRIGGERED, not open-triggered: CI fires only when a maintainer
  # applies the `ci-approved` label (the `labeled` event), never on PR open or on
  # a contributor's push. This keeps untrusted fork code from touching the
  # self-hosted runners until the diff has been reviewed. The `authorize` job
  # additionally verifies the label is specifically `ci-approved`, and
  # .github/workflows/pr-gate-delabel.yml strips the label on every new push so a
  # post-approval commit cannot ride a stale label (TOCTOU guard) — re-label to
  # re-run. Same-repo work can still be tested by pushing to `dev`/`prod`.
  pull_request:
    types: [labeled]
  push:
    branches: [prod, dev]

# Default to the least privilege the GITHUB_TOKEN needs. CI only reads the repo;
# any job needing more must opt in explicitly. (pr-gate-delabel.yml overrides
# this with pull-requests: write because it edits labels.)
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Node 22 (LTS): Electron 41 requires Node >=22.12 (EBADENGINE on 20). Bumped
  # from 20 alongside the overlay's electron 31→41 security bump.
  NODE_VERSION: "22"
  # Force public npm registry — self-hosted runners have a private .npmrc that
  # causes E401 on cache misses. All packages in this repo are on public npm.
  npm_config_registry: https://registry.npmjs.org

jobs:
  # ── PR authorization gate ───────────────────────────────────────────────────
  # No PR (fork OR same-repo) executes on the self-hosted runners until a
  # maintainer reviews the diff and applies the `ci-approved` label. Every other
  # job `needs: authorize`, so if this is skipped, nothing downstream runs.
  #   - push to prod/dev → authorized automatically (already merged/trusted)
  #   - any pull_request   → authorized ONLY when the `ci-approved` label present
  # Applying a label requires write/triage access, which fork authors do not have,
  # so only maintainers can trigger a run. A new push strips the label (see
  # pr-gate-delabel.yml), forcing re-review before CI can run again.
  authorize:
    name: Authorize CI run
    runs-on: ${{ vars.CI_RUNNER && fromJSON(vars.CI_RUNNER) || 'ubuntu-latest' }}
    if: >-
      github.event_name == 'push' ||
      contains(github.event.pull_request.labels.*.name, 'ci-approved')
    steps:
      - run: echo "Authorized (${{ github.event_name }})."

  # ── Required gate members (Phase 2: lint + backend now blocking) ─────────────
  lint-typecheck:
    name: Lint + Typecheck (${{ matrix.workspace }})
    needs: authorize
    runs-on: ${{ vars.CI_RUNNER && fromJSON(vars.CI_RUNNER) || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        workspace: [backend, admin-dashboard, cross-platform-overlay]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ matrix.workspace }}/package-lock.json
      - name: Install
        working-directory: ${{ matrix.workspace }}
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
        run: npm ci
      # The overlay shares admin-dashboard's ChatOverlay (and its deps: react,
      # @tanstack/react-query, etc.). tsc follows those cross-imports, so the
      # overlay typecheck needs admin-dashboard's node_modules present too.
      - name: Install admin-dashboard deps (overlay cross-imports)
        if: matrix.workspace == 'cross-platform-overlay'
        working-directory: admin-dashboard
        run: npm ci
      - name: Typecheck
        working-directory: ${{ matrix.workspace }}
        run: npx tsc --noEmit -p ./tsconfig.json

  backend-jest:
    name: Backend (Jest + TS units)
    needs: authorize
    runs-on: ${{ vars.CI_RUNNER && fromJSON(vars.CI_RUNNER) || 'ubuntu-latest' }}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fcm
          POSTGRES_PASSWORD: fcm
          POSTGRES_DB: fcm_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fcm"
          --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      # Service-container host: GitHub-hosted runners expose service containers on
      # localhost; the self-hosted DinD setup exposes them on the 'docker' sidecar.
      # CI_RUNNER set (self-hosted) => 'docker'; unset (hosted default) => 'localhost'.
      DATABASE_URL: postgresql://fcm:fcm@${{ vars.CI_RUNNER && 'docker' || 'localhost' }}:5432/fcm_test
      REDIS_URL: redis://${{ vars.CI_RUNNER && 'docker' || 'localhost' }}:6379
      NODE_ENV: test
      # express-session requires a secret at boot; integration tests boot the app.
      SESSION_SECRET: ci-test-session-secret
      # Role-gated endpoint tests send x-api-key = ADMIN_API_KEY (fallback
      # 'test-admin-key'); auth.ts only honours it when env.ADMIN_API_KEY matches.
      ADMIN_API_KEY: test-admin-key
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install
        working-directory: backend
        run: npm ci
      - name: Prisma generate + schema push
        working-directory: backend
        run: |
          npx prisma generate
          npx prisma db push --skip-generate
      - name: Build (jest tests target compiled .js)
        working-directory: backend
        run: npm run build
      - name: Jest (supertest integration)
        working-directory: backend
        run: npm test
      - name: TS unit suites (node:test via testRunner)
        working-directory: backend
        run: npm run test:unit

  # ── OSV dependency vulnerability scan (NON-BLOCKING pilot) ───────────────────
  # Scans every lockfile in the tree against the OSV database (osv.dev) on each
  # ci-approved PR and on push to prod/dev. Deliberately a job in THIS workflow
  # (not a standalone osv-scan.yml triggering on bare `pull_request`) so it stays
  # behind the `authorize`/`ci-approved` label gate — a standalone PR-triggered
  # workflow would run untrusted fork code on the self-hosted runner without the
  # gate. `continue-on-error: true` + absence from ci-summary.needs => results are
  # advisory (job log, PR step summary, artifact) and never block the merge gate.
  # To PROMOTE to a hard gate once findings are triaged: remove continue-on-error
  # and add `osv-scan` to the ci-summary `needs:` list (see docs/testing/ci-cd-pipeline.md).
  osv-scan:
    name: OSV vulnerability scan
    needs: authorize
    runs-on: ${{ vars.CI_RUNNER && fromJSON(vars.CI_RUNNER) || 'ubuntu-latest' }}
    continue-on-error: true
    env:
      OSV_VERSION: v2.3.8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install osv-scanner
        run: |
          set -euo pipefail
          BIN="$RUNNER_TEMP/osv-scanner"
          curl -sSfL \
            "https://github.com/google/osv-scanner/releases/download/${OSV_VERSION}/osv-scanner_linux_amd64" \
            -o "$BIN"
          chmod +x "$BIN"
          "$BIN" --version
      - name: Scan dependencies
        id: scan
        run: |
          set -uo pipefail
          BIN="$RUNNER_TEMP/osv-scanner"
          echo "## OSV vulnerability scan" >> "$GITHUB_STEP_SUMMARY"
          set +e
          "$BIN" scan source -r . --format markdown > osv-report.md 2>osv-err.txt
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            echo "No known vulnerabilities found." >> "$GITHUB_STEP_SUMMARY"
            echo "osv_result=clean" >> "$GITHUB_OUTPUT"
          elif [ "$code" -eq 1 ]; then
            echo "Known vulnerabilities found (non-blocking pilot):" >> "$GITHUB_STEP_SUMMARY"
            cat osv-report.md >> "$GITHUB_STEP_SUMMARY"
            echo "osv_result=vulnerable" >> "$GITHUB_OUTPUT"
          else
            echo "Scanner error (exit $code):" >> "$GITHUB_STEP_SUMMARY"
            cat osv-err.txt >> "$GITHUB_STEP_SUMMARY"
            echo "osv_result=error" >> "$GITHUB_OUTPUT"
          fi
          cat osv-report.md osv-err.txt 2>/dev/null || true
      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: osv-report
          path: |
            osv-report.md
            osv-err.txt
          if-no-files-found: ignore

  # ── Required gate member: unit (Vitest + RTL) — overlay + dashboard ──────────
  # Consolidated from the former overlay-unit-component + dashboard-unit-component
  # jobs into one matrix. ELECTRON_SKIP_BINARY_DOWNLOAD is harmless for the
  # dashboard (no electron dep) so the install step is uniform across legs.
  unit-vitest:
    name: Unit (Vitest + RTL — ${{ matrix.workspace }})
    needs: authorize
    runs-on: ${{ vars.CI_RUNNER && fromJSON(vars.CI_RUNNER) || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        workspace: [cross-platform-overlay, admin-dashboard]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ matrix.workspace }}/package-lock.json
      - name: Install
        working-directory: ${{ matrix.workspace }}
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
        run: npm ci
      - name: Vitest (NOT the playwright `test` script)
        working-directory: ${{ matrix.workspace }}
        run: npm run test:unit --if-present

  # ── Game-mod SWF anchor tests (Python) — REQUIRED gate ───────────────────────
  # The in-game HUD .ba2 build patches Bethesda's HUDMenu via apply-patch.py against
  # fixed anchors in fcm-inject.as. CI checks the source/config contract and the
  # stdlib BA2 packer fixture; the fresh Bethesda HUDMenu anchor check runs in
  # build.sh after ffdec decompiles the current live archive (CI cannot legally
  # redistribute that decompiled input). Pure stdlib — uses system python3.
  gamemod-anchors:
    name: Game-mod SWF anchors + config (Python + Haxe)
    needs: authorize
    runs-on: ${{ vars.CI_RUNNER && fromJSON(vars.CI_RUNNER) || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify promotion-critical sources are tracked
        run: |
          set -euo pipefail
          required=(
            backend/prisma/migrations/20260803120000_ai_moderation/migration.sql
            backend/prisma/migrations/20260818120000_relay_persistence_contract/migration.sql
            backend/prisma/migrations/20260818123000_relax_chat_profanity_word_filters/migration.sql
            backend/src/services/aiModerationService.ts
            backend/src/scripts/applyPostPushPatches.ts
            backend/src/services/relay/wireSanitize.ts
            backend/src/utils/resolveActorId.ts
            backend/src/utils/targetedAttack.ts
            backend/src/utils/oauthState.ts
            backend/tests/aiModerationService.test.js
            backend/tests/autoModEngineAi.test.js
            backend/tests/autoModRulesController.test.js
            backend/tests/wireSanitize.test.js
            backend/src/utils/__tests__/oauthState.test.ts
            game-mods/EasyFishing/test-install.sh
            game-mods/FCMBridge/hudmenu-chat/test_ba2tool.py
          )
          for path in "${required[@]}"; do
            test -f "$path" || { echo "Missing required source: $path" >&2; exit 1; }
            git ls-files --error-unmatch "$path" >/dev/null || {
              echo "Required source is present but not tracked: $path" >&2
              exit 1
            }
          done
          echo "All promotion-critical sources are tracked."
      - name: Run FCMBridge anchor tests
        run: |
          python3 game-mods/FCMBridge/hudmenu-chat/test_anchors.py
          python3 game-mods/FCMBridge/hudmenu-chat/test_ba2tool.py
          python3 game-mods/FCMBridge/hudmodloader-chat/test_package.py
          python3 Packaging/test-release-scripts.py
      # FcmConfig parser/clamp unit tests (CAP-001..005, #303/#304) — pure Haxe, --interp.
      - name: Install Haxe
        run: sudo apt-get update && sudo apt-get install -y haxe
      - name: Run FcmConfig unit tests
        working-directory: game-mods/FCMBridge/hudmodloader-chat
        run: haxe test-config.hxml
      - name: Run FcmIdentity unit tests
        working-directory: game-mods/FCMBridge/hudmodloader-chat
        run: haxe test-identity.hxml
      - name: Compile FCMChatWidget
        working-directory: game-mods/FCMBridge/hudmodloader-chat
        run: haxe build.hxml
      - name: Run EasyFishing installer tests
        run: bash game-mods/EasyFishing/test-install.sh

  # ── Overlay launch smoke (Linux) — REQUIRED gate ─────────────────────────────
  # Builds the packaged overlay and asserts a clean startup. Catches crash-on-launch
  # (e.g. v1.3.82's missing './overlay-core' in the asar, which bricked users).
  # Proven to FAIL on that exact regression. In ci-summary.needs => blocking.
  # (The former auto-update E2E was removed — the overlay no longer auto-updates;
  # it shows a passive OS notification instead. See docs/overlay/auto-update.md.)
  overlay-launch-smoke-linux:
    name: Overlay launch smoke (Linux)
    needs: authorize
    runs-on: ${{ vars.CI_RUNNER && fromJSON(vars.CI_RUNNER) || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: cross-platform-overlay/package-lock.json
      - name: Cache Electron binary
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/electron
          key: electron-${{ hashFiles('cross-platform-overlay/package-lock.json') }}
      # admin-dashboard must install first — the renderer cross-imports it (@dashboard).
      - name: Install admin-dashboard deps
        working-directory: admin-dashboard
        run: npm ci
      - name: Install overlay deps
        working-directory: cross-platform-overlay
        run: npm ci
      - name: Build renderer
        working-directory: cross-platform-overlay
        run: npm run build:renderer
      - name: Validate Linux installer decision path
        run: |
          bash -n Packaging/linux/install.sh
          bash Packaging/linux/install.sh --help >/dev/null
          bash Packaging/linux/install.sh --print-plan
      - name: Install Xvfb + Electron system libs
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends xvfb libgtk-3-0 libnotify4 libnss3 libxss1 libxtst6 xdg-utils libatspi2.0-0 libuuid1 libsecret-1-0 libgbm1
          # libasound2 was renamed libasound2t64 in Ubuntu 24.04 (the t64 ABI transition);
          # try the new name first, fall back to the classic name on older runners.
          sudo apt-get install -y --no-install-recommends libasound2t64 || sudo apt-get install -y --no-install-recommends libasound2
      # ── Packaged-launch smoke ──
      - name: Build Linux package
        working-directory: cross-platform-overlay
        run: npx electron-builder --linux dir
      - name: Smoke-test packaged overlay (headless launch, ~15s)
        run: |
          BIN="cross-platform-overlay/dist-electron/linux-unpacked/fallout-chat-mod"
          xvfb-run -a node cross-platform-overlay/scripts/ci-launch-smoke.mjs "$BIN"

  # ── Windows NSIS build verification — REQUIRED gate ──────────────────────────
  # Builds the NSIS installer NATIVELY on windows-latest (no Wine, no Docker, no
  # GHCR image — the self-hosted Wine/DinD/docker-cp strategy was superseded by the
  # GitHub-hosted runner migration; switchable back to self-hosted via
  # CI_RUNNER_WINDOWS). Build-correctness only: asserts the installer + exe are
  # present and non-trivial, and that NO auto-update feed files (app-update.yml /
  # latest*.yml) are emitted — the overlay no longer auto-updates (it shows a
  # passive OS notification instead; see docs/overlay/auto-update.md).
  overlay-build-windows-nsis:
    name: Overlay Windows NSIS build verification
    needs: authorize
    runs-on: ${{ vars.CI_RUNNER_WINDOWS && fromJSON(vars.CI_RUNNER_WINDOWS) || 'windows-latest' }}
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && (github.ref == 'refs/heads/prod' || github.ref == 'refs/heads/dev'))
    timeout-minutes: 30
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: cross-platform-overlay/package-lock.json
      # admin-dashboard installs first — the renderer cross-imports it (@dashboard).
      - name: Install admin-dashboard deps
        run: npm ci
        working-directory: admin-dashboard
      - name: Install overlay deps
        run: npm ci
        working-directory: cross-platform-overlay
      - name: Build renderer
        run: npm run build:renderer
        working-directory: cross-platform-overlay
      - name: Build Windows NSIS package (native)
        run: npx electron-builder --win nsis --publish=never
        working-directory: cross-platform-overlay
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Windows build artifact verification
        run: node .github/scripts/win-artifacts-check.mjs

  # ── The single required status check ────────────────────────────────────────
  ci-summary:
    name: CI Summary
    runs-on: ${{ vars.CI_RUNNER && fromJSON(vars.CI_RUNNER) || 'ubuntu-latest' }}
    if: always()
    needs:
      - authorize                      # PR gate — skipped (unlabeled) ⇒ this summary fails, no false green
      - unit-vitest                    # consolidated overlay + dashboard Vitest (matrix)
      - overlay-launch-smoke-linux     # packaged-launch smoke (Linux)
      - overlay-build-windows-nsis     # NSIS build verification + no-feed-files assertion (Windows)
      - lint-typecheck                 # Phase 2: now a required blocking gate
      - backend-jest                   # Phase 2: now a required blocking gate
      - gamemod-anchors                # in-game .ba2 SWF anchor checks (Python)
    steps:
      # Require every listed job to have SUCCEEDED. A skipped job (e.g. an
      # unlabeled fork PR where `authorize` did not run) must NOT pass the gate,
      # so we check for the absence of success rather than just the absence of
      # failure — otherwise skipped required jobs would false-green the merge.
      - name: Require all gate jobs to have succeeded
        run: |
          if [ "${{ contains(needs.*.result, 'failure') }}" = "true" ] || \
             [ "${{ contains(needs.*.result, 'cancelled') }}" = "true" ] || \
             [ "${{ contains(needs.*.result, 'skipped') }}" = "true" ]; then
            echo "A required job failed, was cancelled, or was skipped (fork PR not yet ci-approved?)."
            exit 1
          fi
          echo "All required jobs passed."

  # fcm-dev deploys via a native Dokploy webhook registered in the GitHub repo
  # (push events) — Dokploy matches the `dev` branch and redeploys. Not CI-gated
  # by design (chosen 2026-06-12). The prior CI-gated deploy job was removed.
