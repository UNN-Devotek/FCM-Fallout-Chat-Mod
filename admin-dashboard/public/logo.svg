<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 64" width="420" height="64">
  <defs>
    <filter id="glow" x="-10%" y="-40%" width="120%" height="180%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- ◈ icon -->
  <text x="8" y="42"
        font-family="Courier New, Courier, monospace"
        font-size="28"
        fill="#D4B040"
        opacity="0.85"
        filter="url(#glow)">◈</text>

  <!-- FALLOUT CHAT MOD -->
  <text x="44" y="44"
        font-family="Courier New, Courier, monospace"
        font-weight="bold"
        font-size="24"
        fill="#D4B040"
        letter-spacing="3"
        filter="url(#glow)">FALLOUT CHAT MOD</text>
</svg>
